<!DOCTYPE html> 
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Reviews</title>
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">
    <style>
        body {
            background-color: #000;
            color: #fff;
            font-family: Arial, sans-serif;
        }
        .carousel-item {
            text-align: center;
        }
        .review-card {
            border: 1px solid #fff;
            border-radius: 10px;
            padding: 20px;
            background: #222;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.1);
        }
        .review-image {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            object-fit: cover;
            margin-bottom: 15px;
        }
        .submit-section {
            margin-top: 40px;
        }
        .form-box {
            background-color: #222; 
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(255, 255, 255, 0.2);
        }
        .form-group {
            margin-bottom: 15px;
        }
        h1, h2 {
            font-weight: bold;
            font-family: 'Arial Black', sans-serif;
        }
    </style>
</head>
<body>

<div class="container mt-5">
    <h1 class="text-center">Customer Reviews</h1>

    <div id="reviewCarousel" class="carousel slide mt-4" data-ride="carousel" data-interval="3000">
        <div class="carousel-inner" id="review-list">
            <!-- Review cards will be injected here -->
        </div>
        <a class="carousel-control-prev" href="#reviewCarousel" role="button" data-slide="prev">
            <span class="carousel-control-prev-icon" aria-hidden="true"></span>
            <span class="sr-only">Previous</span>
        </a>
        <a class="carousel-control-next" href="#reviewCarousel" role="button" data-slide="next">
            <span class="carousel-control-next-icon" aria-hidden="true"></span>
            <span class="sr-only">Next</span>
        </a>
    </div>
    <br>
    <br>
    <div class="submit-section mt-4">
        <h2 class="text-center">Submit Your Review</h2>
        <br>
        <div class="form-box">
            <form id="form">
                <div class="form-group">
                    <label for="name">Your Name</label>
                    <input type="text" class="form-control form-control-sm" id="name" placeholder="Enter Your Name" required>
                </div>
                <div class="form-group">
                    <label for="book">Book Title</label>
                    <input type="text" class="form-control form-control-sm" id="book" placeholder="Enter the Book Title" required>
                </div>
                <div class="form-group">
                    <label for="review">Your Review</label>
                    <textarea class="form-control form-control-sm" id="review" rows="4" placeholder="Enter Your Review" required></textarea>
                </div>
                <button type="submit" class="btn btn-light btn-block">Submit</button>
            </form>
        </div>
        <br><br>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
<script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
<script>
    const reviews = [
        {
            name: "Alice Johnson",
            book: "The Great Adventure",
            review: "This book was an amazing read! I couldn't put it down.",
            image: "https://randomuser.me/api/portraits/women/1.jpg"
        },
        {
            name: "Bob Smith",
            book: "Learning Bootstrap",
            review: "A great insight into the subject. Highly recommend!",
            image: "https://randomuser.me/api/portraits/men/1.jpg"
        },
        {
            name: "Charlie Brown",
            book: "Inspiring Stories",
            review: "An inspiring story that really resonated with me.",
            image: "https://randomuser.me/api/portraits/men/2.jpg"
        }
    ];

    const reviewList = document.getElementById('review-list');

    function loadReviews() {
        reviews.forEach((review, index) => {
            const activeClass = index === 0 ? 'active' : '';
            reviewList.innerHTML += `
                <div class="carousel-item ${activeClass}">
                    <div class="review-card">
                        <img src="${review.image}" alt="${review.name}" class="review-image">
                        <h5>${review.name}</h5>
                        <h6 class="text-muted">${review.book}</h6>
                        <p>${review.review}</p>
                    </div>
                </div>
            `;
        });
    }

    document.getElementById('form').addEventListener('submit', function(event) {
        event.preventDefault();
        
        const name = document.getElementById('name').value;
        const book = document.getElementById('book').value;
        const review = document.getElementById('review').value;

        if (name && book && review) {
            const defaultImage = "https://randomuser.me/api/portraits/men/3.jpg";
            reviews.push({ name, book, review, image: defaultImage });
            document.getElementById('form').reset();
            reviewList.innerHTML = '';
            loadReviews();
        }
    });

   
    loadReviews();
</script>
</body>
</html>
