<!DOCTYPE html>
<html lang="en">
<head>

    <title>Product Cards</title>
    <style>
        
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #f4f4f4;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
    background: url(https://t3.ftcdn.net/jpg/05/34/69/32/360_F_534693205_lOcpfVGlO5VWw4NmGbB5otMbki2NpaYs.jpg);
}

.cart-summary {
    width: 100%;
    max-width: 600px;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    padding: 20px;
    margin-bottom: 20px;
}
.cart-summary {
    text-align: center;
    justify-content: center;
    align-items: center;
}

.cart-summary h2 {
    margin-bottom: 10px;
    text-align: center;
}
.cart-summary .btn{
    background-color: #28a745;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
    text-decoration: none;
}
.cart-details {
    font-size: 16px;
}

.cart-details p {
    margin: 10px 0;
}

.product-container {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px;
    width: 100%;
    max-width: 1200px;
}

.product-card {
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    text-align: center;
    padding: 15px;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.product-image {
    width: 100%;
    max-width: 200px;
    height: auto;
    border-radius: 10px;
    margin-bottom: 10px;
}

.product-name {
    font-size: 18px;
    margin: 10px 0;
}

.product-price {
    font-size: 16px;
    color: #333;
    margin-bottom: 10px;
}

.add-to-cart {
    background-color: #28a745;
    color: #fff;
    border: none;
    padding: 10px;
    border-radius: 5px;
    cursor: pointer;
    font-size: 16px;
    transition: background-color 0.3s ease;
}

.add-to-cart:hover {
    background-color: #218838;
}
#couponbtn{
    background-color: #28a745;
    color: white;
    border: none;
    height: 30px;
   border-radius: 8%;
   padding-left: 10px;
   padding-right: 10px;
}
#inputcoupon{
    height: 50px;
    

}


/* Responsive Design */
@media (max-width: 1200px) {
    .product-container {
        grid-template-columns: repeat(3, 1fr);
    }
}

@media (max-width: 900px) {
    .product-container {
        grid-template-columns: repeat(2, 1fr);
    }
}

@media (max-width: 600px) {
    .product-container {
        grid-template-columns: 1fr;
    }
}

    </style>
</head>
<body>

                <button onclick="applyCoupon()" id="couponbtn">Apply Coupon</button>

            </div>

            <a href="payment.html" class="btn">Pay Now</a>

    <script>
    // script.js
    let cartCount = 0;
        let totalPrice = 0;
        const validCoupon = 'FIRST10'; 
        const discountPercentage = 10; 

        function addToCart(price) {
            cartCount++;
            totalPrice += price;

            
            document.getElementById('cart-count').textContent = cartCount;
            document.getElementById('total-price').textContent = `₹${totalPrice}`;
        }

        function applyCoupon() {
            const couponCode = document.getElementById('couponCode').value.trim().toUpperCase();

            if (couponCode === validCoupon) {
                const discount = (totalPrice * discountPercentage) / 100;
                const discountedPrice = totalPrice - discount;

                
                document.getElementById('discounted-price').textContent = discountedPrice.toFixed(2);
                document.getElementById('discountMessage').classList.remove('hidden');
            } else {
                alert('Invalid coupon code. Please try again.');
            }
        }
</script>
